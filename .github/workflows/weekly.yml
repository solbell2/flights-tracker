name: Weekly Flight Price Check

on:
  schedule:
    # Saturday 16:00 UTC = 9:00 AM PDT (8:00 AM PST in winter; cron does not observe DST).
    - cron: "0 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run flight agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python flight_agent.py

      - name: Commit history
        run: |
          git config user.name "flight-agent-bot"
          git config user.email "actions@github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update flight history $(date -u +%Y-%m-%d)"
            git push
          fi
